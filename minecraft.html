<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Hub - Eyad Nintendo Ali</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #050816, #000);
  color: white;
  overflow-x: hidden;
}

/* 🌌 STARS */
.star {
  position: fixed;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
}

/* HEADER */
header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
}

/* LOGO */
.logo {
  position: absolute;
  left: 20px;
  font-size: 18px;
  color: #00ccff;
  font-weight: bold;
}

/* NAV CENTER */
nav {
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

/* BIG BUTTONS */
nav button {
  padding: 14px 22px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #111;
  color: white;
  transition: 0.3s;
  min-width: 140px;
}

nav button:hover {
  background: #00ccff;
  color: black;
  transform: scale(1.1);
}

/* SECTIONS */
.section {
  display: none;
  padding: 30px;
  max-width: 1000px;
  margin: auto;
}

.active {
  display: block;
}

/* CARDS */
.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.card {
  width: 200px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px #00ccff;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

/* LIST ITEMS */
.list-item {
  padding: 12px;
  background: rgba(255,255,255,0.05);
  margin-bottom: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.list-item:hover {
  background: rgba(0,204,255,0.2);
}
</style>
</head>

<body>

<!-- 🌌 STARS -->
<script>
for (let i = 0; i < 120; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";
  s.style.animationDuration = (1 + Math.random() * 3) + "s";
  document.body.appendChild(s);
}
</script>

<header>
  <div class="logo">⛏️ Minecraft Hub</div>

  <nav>
    <button onclick="showSection('space')">🌌 Space</button>
    <button onclick="showSection('minecraft')">⛏️ Minecraft</button>
    <button onclick="showSection('mods')">📦 Mods</button>
    <button onclick="showSection('videos')">🎥 Videos</button>
  </nav>
</header>

<!-- SPACE -->
<div id="space" class="section active">
  <h1>🌌 Space Mode</h1>
  <p>Welcome to your Minecraft + Space hub.</p>
</div>

<!-- MINECRAFT -->
<div id="minecraft" class="section">
  <h1>⛏️ Minecraft</h1>

  <div class="cards">
    <div class="card" onclick="location.href='Boy&jelly.html'">
      <img src="Boy&jelly.png">
      <p>Boy & Jelly Mod</p>
    </div>

    <div class="card" onclick="location.href='Game Haven domdom.html'">
      <img src="Game Haven domdom.png">
      <p>Game Haven Mod</p>
    </div>
  </div>
</div>

<!-- MODS -->
<div id="mods" class="section">
  <h1>📦 Mods</h1>

  <div class="list-item">🔥 Realistic Shader Mod</div>
  <div class="list-item">⚔️ Epic Weapons Mod</div>
  <div class="list-item">🐉 Dragon Expansion Mod</div>
  <div class="list-item">🌌 Space Dimension Mod</div>
</div>

<!-- VIDEOS -->
<div id="videos" class="section">
  <h1>🎥 Videos</h1>

  <div class="list-item" onclick="window.open('https://www.youtube.com','_blank')">
    ▶ Minecraft Gameplay
  </div>

  <div class="list-item" onclick="window.open('https://www.youtube.com','_blank')">
    ▶ Mod Showcase
  </div>

  <div class="list-item" onclick="window.open('https://www.youtube.com','_blank')">
    ▶ Space Adventure
  </div>
</div>

<script>
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
