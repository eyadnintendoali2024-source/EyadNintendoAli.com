<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eyad Nintendo Ali AI</title>

<link rel="icon" href="favicon.ico">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000 url("space wallpaper.jpg") center center fixed;
background-size:cover;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#e60012;
padding:18px;
font-size:28px;
font-weight:bold;
text-align:center;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
}

select{
padding:10px;
border:none;
border-radius:10px;
font-size:16px;
background:#222;
color:white;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#e60012;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#c40010;
}

#chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.user{
align-self:flex-end;
background:#0066ff;
padding:12px;
border-radius:15px;
max-width:70%;
word-wrap:break-word;
}

.ai{
align-self:flex-start;
background:#222;
padding:12px;
border-radius:15px;
max-width:70%;
word-wrap:break-word;
}

.bottom{
display:flex;
padding:15px;
gap:10px;
background:rgba(0,0,0,.6);
}

#userInput{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}

.send{
background:#00aa44;
}

.send:hover{
background:#008833;
}

.back{
background:#666;
}

.back:hover{
background:#555;
}

.star{
position:fixed;
background:white;
border-radius:50%;
opacity:.8;
animation:twinkle 2s infinite alternate;
z-index:-1;
}

@keyframes twinkle{
from{
opacity:.3;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1.2);
}
}

</style>

</head>

<body>

<header>
🤖 Eyad Nintendo Ali AI
</header>

<div class="topbar">

<select id="provider">
<option value="openai">ChatGPT</option>
<option value="gemini">Gemini</option>
</select>

<button class="back" onclick="window.location='index.html'">
⬅ Back
</button>

</div>

<div id="chat">

<div class="ai">
👋 Hello!<br><br>

I'm Eyad Nintendo Ali AI.<br><br>

Choose ChatGPT or Gemini from the top and start chatting.
</div>

</div>

<div class="bottom">

<input
type="text"
id="userInput"
placeholder="Type your message...">

<button
class="send"
onclick="sendMessage()">
Send
</button>

</div>

<script>

const stars=document.createElement("div");
document.body.appendChild(stars);

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="star";

let size=Math.random()*3+1;

s.style.width=size+"px";
s.style.height=size+"px";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

stars.appendChild(s);

}

</script>

<script src="ai.js"></script>

</body>
</html>
