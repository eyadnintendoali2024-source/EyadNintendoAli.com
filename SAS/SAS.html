<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAS School Adventure 2.13</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #12354b;
      color: white;
      font: 18px Arial, sans-serif;
    }
    body {
      position: relative;
    }
    a {
      color: #80dcff;
      text-decoration: none;
      font-weight: bold;
    }
    #sasBackLink {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 100000;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid #80dcff;
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: 0 0 20px rgba(45, 199, 255, 0.4);
    }
    #sasBackLink a {
      color: white;
    }
  </style>
</head>
<body>
  <div id="sasBackLink"><a href="../index.html">⬅️ Back to EyadNintendoAli Page</a></div>
  <script src="sas_compat.js"></script>
  <script>
    (function () {
      var originalTitle = document.title;
      function addBackText() {
        var link = document.getElementById('sasBackLink');
        if (!link) return;
        link.style.display = 'block';
      }
      addBackText();
      if (document.readyState === 'complete') {
        setTimeout(addBackText, 100);
      }
      document.addEventListener('DOMContentLoaded', addBackText);
      document.title = originalTitle;
    })();
  </script>
</body>
</html>
