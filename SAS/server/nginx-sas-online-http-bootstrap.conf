# Temporary HTTP-only host, needed before requesting a TLS certificate.
# Replace YOUR_GAME_DOMAIN before enabling.
server {
    listen 80;
    server_name YOUR_GAME_DOMAIN;
    root /var/www/sas-school;
    index index.html SAS.html;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { try_files $uri $uri/ =404; }
}
