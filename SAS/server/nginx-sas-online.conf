# Replace YOUR_GAME_DOMAIN and certificate paths before enabling this server block.
server {
    listen 80;
    server_name YOUR_GAME_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name YOUR_GAME_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_GAME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_GAME_DOMAIN/privkey.pem;

    # Copy the contents of the SAS folder into this directory. This serves
    # SAS.html and the local game assets from the same HTTPS origin.
    root /var/www/sas-school;
    index index.html SAS.html;

    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
