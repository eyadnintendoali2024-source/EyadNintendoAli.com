<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Haven domdom - Eyad Nintendo Ali</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #0f0f0f;
  color: white;
  overflow-x: hidden;
}

/* 🎉 CONFETTI PARTY */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
  opacity: 0.8;
  border-radius: 50%;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

header {
  background-color: #e60012;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 25px;
  color: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
.logo a { color: white; text-decoration: none; }
nav { display: flex; align-items: center; gap: 15px; position: relative; }

button {
  background-color: white;
  color: #e60012;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
}
button:hover { background-color: #ffe5e5; }

.dropdown { position: relative; display: inline-block; }
.dropdown-content {
  display: none;
  position: absolute;
  background-color: white;
  min-width: 120px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  border-radius: 6px;
  z-index: 1;
}
.dropdown-content a {
  color: #e60012;
  padding: 8px 12px;
  display: block;
  text-decoration: none;
  font-weight: bold;
}
.dropdown-content a:hover { background-color: #ffe5e5; }
.dropdown:hover .dropdown-content { display: block; }

.mute-btn {
  background: #fff;
  color: #e60012;
  border-radius: 50%;
  padding: 6px 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: .3s;
}
.mute-btn:hover { background: #ffe5e5; }

/* Game section */
.wrap {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 16px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.game-thumb {
  flex: 1 1 400px;
  max-width: 400px;
}
.game-thumb img {
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.game-info {
  flex: 1 1 400px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  justify-content: flex-start;
}
.game-info h1 {
  margin: 0;
  color: #00ffcc;
  font-size: 32px;
}
.download-btn {
  background-color: #00ffcc;
  color: #0f0f0f;
  padding: 12px 20px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  text-align: center;
  transition: 0.3s;
}
.download-btn:hover { background-color: #00cccc; }

@media (max-width: 768px) {
  .wrap { flex-direction: column; align-items: center; }
  .game-info { text-align: center; }
}
</style>
</head>
<body>

<!-- 🎉 CONFETTI SCRIPT -->
<script>
for (let i = 0; i < 100; i++) {
  let c = document.createElement("div");
  c.className = "confetti";
  c.style.left = Math.random() * 100 + "vw";
  c.style.background = `hsl(${Math.random()*360},100%,50%)`;
  c.style.width = c.style.height = Math.random() * 10 + 5 + "px";
  c.style.animationDuration = (3 + Math.random() * 5) + "s";
  document.body.appendChild(c);
}
</script>

<!-- Background music -->
<audio id="bgMusic" src="Game Haven domdom.mp3" loop></audio>
