<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Prediction</title>
<link rel="icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0b1026, #000000);
  overflow-x: hidden;
  color: white;
  text-align: center;
}

/* 🌌 STARS */
.star {
  position: fixed;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

header {
  background: rgba(0,0,40,0.8);
  backdrop-filter: blur(8px);
  padding: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

header a {
  color: white;
  text-decoration: none;
  font-size: 28px;
  font-weight: bold;
}

.container {
  max-width: 800px;
  margin: 60px auto;
  background: rgba(255,255,255,0.08);
  padding: 30px;
  border-radius: 15px;
  backdrop-filter: blur(6px);
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
}

h1 {
  color: #00ccff;
}

select, button {
  margin: 15px;
  padding: 12px;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #00ccff;
}

button {
  background: #00ccff;
  color: black;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  transform: scale(1.05);
}

#result {
  margin-top: 25px;
  font-size: 24px;
  color: #00ffcc;
}
</style>
</head>

<body>

<script>
for (let i = 0; i < 150; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";
  let size = Math.random() * 3 + 1;
  s.style.width = size + "px";
  s.style.height = size + "px";
  s.style.animationDuration = (1 + Math.random() * 3) + "s";
  document.body.appendChild(s);
}
</script>

<header>
  <a href="index.html">🚀 Eyad Nintendo Ali</a>
</header>

<div class="container">
  <h1>⚽ Football Prediction ⚽</h1>
  <p>Who do you think will <b>Win</b>?</p>

  <select id="winner">
    <option value="Egypt">🇪🇬 Egypt</option>
    <option value="Argentina">🇦🇷 Argentina</option>
  </select>

  <p>Who do you think will <b>Lose</b>?</p>

  <select id="loser">
    <option value="Argentina">🇦🇷 Argentina</option>
    <option value="Egypt">🇪🇬 Egypt</option>
  </select>

  <br>

  <button onclick="showPrediction()">Submit Prediction</button>

  <div id="result"></div>
</div>

<script>
function showPrediction() {
  const winner = document.getElementById("winner").value;
  const loser = document.getElementById("loser").value;
  const result = document.getElementById("result");

  if (winner === loser) {
    result.innerHTML = "❌ Please choose different teams!";
    return;
  }

  if (winner === "Argentina") {
    result.innerHTML = "<h2 style='color:red;'>❌ What F*** is Eygpt not the F****** Argentina ⚠️</h2>";
    return;
  }

  result.innerHTML =
    "<h2 style='color:lime;'>🎉 YOU WIN!</h2>" +
    "<p>🏆 You predicted <b>Egypt</b> will WIN and <b>Argentina</b> will LOSE!</p>";
}
</script>

</body>
</html>
