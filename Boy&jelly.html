<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boy & Jelly - Eyad Nintendo Ali</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #0f0f0f;
  overflow-x: hidden;
  color: #fff;
}

/* 🎉 CONFETTI PARTY */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
  opacity: 0.8;
  border-radius: 50%;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

/* Header and nav */
header {
  background-color:#0066ff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 25px;
  color:white;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}
.logo { font-size:24px; font-weight:bold; letter-spacing:1px; }
.logo a { color:white; text-decoration:none; }
nav { display:flex; align-items:center; gap:15px; }

button {
  background-color:white;
  color:#0066ff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  display:flex;
  align-items:center;
  gap:6px;
}
button:hover { background-color:#e6f0ff; }

.dropdown { position:relative; display:inline-block; }
.dropdown-content {
  display:none;
  position:absolute;
  background-color:white;
  min-width:120px;
  box-shadow:0px 8px 16px rgba(0,0,0,0.2);
  border-radius:6px;
  z-index:1;
}
.dropdown-content a {
  color:#0066ff;
  padding:8px 12px;
  display:block;
  text-decoration:none;
  font-weight:bold;
}
.dropdown-content a:hover { background-color:#e6f0ff; }
.dropdown:hover .dropdown-content { display:block; }

/* Game section */
.wrap {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 16px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.game-thumb { flex: 1 1 400px; max-width: 400px; }
.game-thumb img { width:100%; height:auto; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.4); }

.game-info { flex:1 1 400px; display:flex; flex-direction:column; gap:16px; justify-content:flex-start; }
.game-info h1 { margin:0; color:#00ffcc; font-size:32px; }
.download-btn {
  background-color:#00ffcc;
  color:#0f0f0f;
  padding:12px 20px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  text-align:center;
  transition:0.3s;
}
.download-btn:hover { background-color:#00cccc; }

/* Party video */
iframe {
  margin-top:40px;
  width:80%;
  height:400px;
  border:none;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

@media (max-width: 768px) {
  .wrap { flex-direction:column; align-items:center; }
  .game-info { text-align:center; }
}
</style>
</head>
<body>

<!-- 🎉 CONFETTI SCRIPT -->
<script>
for (let i = 0; i < 100; i++) {
  let c = document.createElement("div");
  c.className = "confetti";
  c.style.left = Math.random() * 100 + "vw";
  c.style.background = `hsl(${Math.random()*360},100%,50%)`;
  c.style.width = c.style.height = Math.random() * 10 + 5 + "px";
  c.style.animationDuration = (3 + Math.random() * 5) + "s";
  document.body.appendChild(c);
}
</script>

<header>
  <div class="logo"><a href="index.html">Eyad Nintendo Ali</a></div>
  <nav>
    <div class="dropdown">
      <button>🎮 Types ▾</button>
      <div class="dropdown-content">
        <a href="games.html">Games</a>
        <a href="cartoons.html">Cartoons</a>
        <a href="movies.html">Movies</a>
        <a href="news.html">News</a>
      </div>
    </div>
    <button onclick="playSound()">🔊 Sound</button>
    <button class="youtube-btn" onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025', '_blank')">▶️ YouTube</button>
  </nav>
</header>

<div class="wrap">
  <div class="game-thumb">
    <img src="Boy&jelly.png" alt="Boy & Jelly">
  </div>
  <div class="game-info">
    <h1>Boy & Jelly</h1>
    <p>Dive into the world of Boy & Jelly — an adventure full of surprises and fun!</p>
    <a href="https://gamejolt.com/games/215649/948184" target="_blank" class="download-btn">Download / Play</a>
  </div>
</div>

<!-- Party Video -->
<iframe src="https://www.youtube.com/embed/_159DMDqFSM" allowfullscreen></iframe>

<!-- Sound -->
<audio id="partySound" src="party.mp3"></audio>

<script>
// Play sound when button clicked
function playSound() {
  const sound = document.getElementById("partySound");
  sound.play();
}
</script>

</body>
</html>
