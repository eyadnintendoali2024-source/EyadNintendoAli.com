<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boy & Jelly - Eyad Nintendo Ali</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #fff;
  overflow-x: hidden;
  color: #222;
}

/* ❄ SNOW BACKGROUND */
.snowflake {
  position: fixed;
  top: -10px;
  color: #00ffff;
  font-size: 20px;
  user-select: none;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  text-shadow: 0 0 8px #00ffff, 0 0 16px #00ffff;
}
@keyframes fall {
  0% { transform: translateY(-10px); }
  100% { transform: translateY(110vh); }
}

/* Header and nav */
header {
  background-color:#0066ff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 25px;
  color:white;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

/* 🎄 Christmas Logo (with glow) */
.xmas-logo {
  width: 55px;
  height: auto;
  margin-right: 12px;
  user-select: none;
  filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 14px #ff0000);
  animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0% { filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 8px red); }
  50% { filter: drop-shadow(0 0 14px #ffffff) drop-shadow(0 0 22px red); }
  100% { filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 8px red); }
}

.logo { font-size:24px; font-weight:bold; letter-spacing:1px; }
.logo a { color:white; text-decoration:none; }
nav { display:flex; align-items:center; gap:15px; }

button {
  background-color:white;
  color:#0066ff;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  display:flex;
  align-items:center;
  gap:6px;
}
button:hover { background-color:#e6f0ff; }

.dropdown { position:relative; display:inline-block; }
.dropdown-content {
  display:none;
  position:absolute;
  background-color:white;
  min-width:120px;
  box-shadow:0px 8px 16px rgba(0,0,0,0.2);
  border-radius:6px;
  z-index:1;
}
.dropdown-content a {
  color:#0066ff;
  padding:8px 12px;
  display:block;
  text-decoration:none;
  font-weight:bold;
}
.dropdown-content a:hover { background-color:#e6f0ff; }
.dropdown:hover .dropdown-content { display:block; }

/* Game section */
.wrap {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 16px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.game-thumb { flex: 1 1 400px; max-width: 400px; }
.game-thumb img { width:100%; height:auto; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2); }

.game-info { flex:1 1 400px; display:flex; flex-direction:column; gap:16px; justify-content:flex-start; }
.game-info h1 { margin:0; color:#0066ff; font-size:32px; }
.download-btn {
  background-color:#0066ff;
  color:white;
  padding:12px 20px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  text-align:center;
  transition:0.3s;
}
.download-btn:hover { background-color:#0050cc; }

iframe {
  margin-top:40px;
  width:80%;
  height:400px;
  border:none;
  border-radius:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.2);
}

@media (max-width: 768px) {
  .wrap { flex-direction:column; align-items:center; }
  .game-info { text-align:center; }
}
</style>
</head>
<body>

<!-- ❄ SNOW SCRIPT -->
<script>
for (let i = 0; i < 50; i++) {
  let snow = document.createElement("div");
  snow.className = "snowflake";
  snow.innerHTML = "❄";
  snow.style.left = Math.random() * 100 + "vw";
  snow.style.animationDuration = (5 + Math.random() * 5) + "s";
  snow.style.opacity = Math.random();
  snow.style.fontSize = Math.random() * 15 + 15 + "px";
  document.body.appendChild(snow);
}
</script>

<header>
  <!-- 🎄 Christmas Glow Logo -->
  <img src="christmas.png" class="xmas-logo" alt="Christmas">
  <div class="logo"><a href="index.html">Eyad Nintendo Ali</a></div>
  <nav>
    <div class="dropdown">
      <button>🎮 Types ▾</button>
      <div class="dropdown-content">
        <a href="games.html">Games</a>
        <a href="cartoons.html">Cartoons</a>
        <a href="movies.html">Movies</a>
        <a href="news.html">News</a>
      </div>
    </div>
    <button>🔍 Search</button>
    <button>📤 Share</button>
    <button class="youtube-btn" onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025', '_blank')">▶️ YouTube</button>
  </nav>
</header>

<div class="wrap">
  <div class="game-thumb">
    <img src="Boy&jelly.png" alt="Boy & Jelly">
  </div>
  <div class="game-info">
    <h1>Boy & Jelly</h1>
    <p>Dive into the world of Boy & Jelly — an adventure full of surprises and fun!</p>
    <a href="https://gamejolt.com/games/215649/948184" target="_blank" class="download-btn">Download / Play</a>
  </div>
</div>

<iframe src="https://player.vimeo.com/video/987442202?fl=pl&fe=sh" allowfullscreen></iframe>

</body>
</html>
