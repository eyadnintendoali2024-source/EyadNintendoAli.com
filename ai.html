<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali AI</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ff00cc,#3333ff);
  color:white;
  overflow-x:hidden;
}

/* 🎉 CONFETTI */
.confetti{
  position:fixed;
  width:8px;
  height:8px;
  top:-10px;
  animation:fall linear infinite;
  opacity:0.8;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

/* Header */
header{
  text-align:center;
  padding:15px;
  font-size:24px;
  font-weight:bold;
  background:#222;
  text-shadow:0 0 10px #fff;
}

/* Chat */
#chat{
  max-width:900px;
  margin:20px auto;
  padding:20px;
  background:rgba(0,0,0,0.35);
  border-radius:16px;
}
#messages{
  height:400px;
  overflow-y:auto;
}
.msg{
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  max-width:80%;
  line-height:1.5;
  word-wrap:break-word;
}
.user{
  background:white;
  color:black;
  margin-left:auto;
}
.ai{
  background:#222;
  color:white;
}

#inputBox{
  display:flex;
  gap:10px;
  margin-top:15px;
}
input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
}
button{
  padding:12px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(90deg,#00ffcc,#00ccff);
  color:black;
  box-shadow:0 0 12px #00ffff;
  transition:0.3s;
}
button:hover{
  box-shadow:0 0 22px #00ffff;
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 🎉 CONFETTI -->
<script>
for(let i=0;i<80;i++){
  const c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.animationDuration=(3+Math.random()*4)+"s";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  document.body.appendChild(c);
}
</script>

<header>🤖 Eyad Nintendo Ali AI — GPT-5</header>

<div id="chat">
  <div id="messages">
    <div class="msg ai">
      Hello 👋<br>
      I am Eyad Nintendo Ali AI (GPT-5).<br>
      Say anything 😄
    </div>
  </div>

  <div id="inputBox">
    <input id="input" placeholder="Message AI..." 
           onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const messages=document.getElementById("messages");

function addMessage(text,cls){
  const div=document.createElement("div");
  div.className="msg "+cls;
  div.innerHTML=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function send(){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value="";

  setTimeout(()=>{
    addMessage("🎉 The party is very good! 🎉","ai");
  },600);
}
</script>

</body>
</html>
