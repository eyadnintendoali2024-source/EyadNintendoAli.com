<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali AI</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#ff00cc,#3333ff);
  color:white;
}

/* Confetti */
.confetti{
  position:fixed;
  width:8px;
  height:8px;
  top:-10px;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

/* Header */
header{
  text-align:center;
  padding:15px;
  font-size:24px;
  background:#222;
  text-shadow:0 0 10px #fff;
}

/* Top Button */
#topBar{
  display:flex;
  justify-content:flex-start;
  padding:10px;
}
#backBtn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(90deg,#ffcc00,#ffaa00);
}

/* Chat */
#chat{
  max-width:900px;
  margin:10px auto;
  padding:20px;
  background:rgba(0,0,0,.35);
  border-radius:16px;
}
#messages{
  height:360px;
  overflow-y:auto;
}
.msg{
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  max-width:80%;
}
.user{
  background:white;
  color:black;
  margin-left:auto;
}
.ai{
  background:#222;
}
pre{
  background:#111;
  padding:10px;
  border-radius:8px;
  overflow-x:auto;
  color:#00ffcc;
}

/* Input */
#inputBox{
  display:flex;
  gap:10px;
  margin-top:15px;
}
input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
}
button{
  padding:12px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(90deg,#00ffcc,#00ccff);
}
#quickBtn{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<script>
for(let i=0;i<60;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  c.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(c);
}
</script>

<header>🤖 Eyad Nintendo Ali AI — GPT-5</header>

<div id="topBar">
  <button id="backBtn" onclick="goBack()">⬅ Back to Index</button>
</div>

<div id="chat">
  <div id="messages">
    <div class="msg ai">
      Hello 👋<br>
      Ask about Unity or Minecraft like GPT-5 (simple).
    </div>
  </div>

  <div id="inputBox">
    <input id="input" placeholder="Ask anything..."
      onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>

  <button id="quickBtn" onclick="askNewGame()">
    🎮 What is the new game coming soon?
  </button>
</div>

<script>
const messages=document.getElementById("messages");

function addMessage(text,cls){
  const div=document.createElement("div");
  div.className="msg "+cls;
  div.innerHTML=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function showNewGame(){
  addMessage("<b>🎮 Game Haven domdom 2</b>","ai");
  const v=document.createElement("div");
  v.className="msg ai";
  v.innerHTML=`
  <iframe width="100%" height="315"
  src="https://www.youtube.com/embed/_159DMDqFSM"
  allowfullscreen></iframe>`;
  messages.appendChild(v);
}

function unityReply(){
  addMessage(`
<b>Unity Example</b>
<pre>
void Update(){
  if(Input.GetKeyDown(KeyCode.Space)){
    Debug.Log("Jump");
  }
}
</pre>
Use Rigidbody for movement.
  `,"ai");
}

function minecraftReply(){
  addMessage(`
<b>Minecraft Command</b>
<pre>
/summon zombie ~ ~ ~ {IsBaby:1}
</pre>
Java Edition.
  `,"ai");
}

function send(){
  const input=document.getElementById("input");
  const text=input.value.trim().toLowerCase();
  if(!text) return;

  addMessage(input.value,"user");
  input.value="";

  if(text==="what is the new game coming soon?"){
    showNewGame();
  }
  else if(text.includes("unity")){
    unityReply();
  }
  else if(text.includes("minecraft")){
    minecraftReply();
  }
  else{
    addMessage("🎉 The party is very good! 🎉","ai");
  }
}

function askNewGame(){
  addMessage("What is the new game coming soon?","user");
  showNewGame();
}

function goBack(){
  window.location.href="index.html";
}
</script>

</body>
</html>
