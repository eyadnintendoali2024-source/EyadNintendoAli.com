<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali AI</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  margin:0; font-family: Arial; background: linear-gradient(135deg, #ff00cc, #3333ff); color:white; overflow-x:hidden;
}
/* 🎉 CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
  opacity: 0.8;
}
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

/* Header */
header { text-align:center; padding:15px; font-size:24px; font-weight:bold; background:#222; text-shadow:0 0 10px #fff; }

/* Chat UI */
#chat { max-width:900px; margin:20px auto; padding:20px; background:rgba(0,0,0,0.35); border-radius:16px; }
#messages { height:400px; overflow-y:auto; }
.msg { margin:10px 0; padding:12px; border-radius:12px; max-width:80%; line-height:1.5; word-wrap: break-word; }
.user { background:white; color:black; margin-left:auto; }
.ai { background:#222; color:white; }
pre { background:#111; padding:12px; border-radius:10px; overflow-x:auto; color:#00ffcc; }
#inputBox { display:flex; gap:10px; margin-top:15px; }
input { flex:1; padding:12px; border-radius:10px; border:none; font-size:16px; }
button { padding:12px 18px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; background: linear-gradient(90deg,#00ffcc,#00ccff); color:black; box-shadow:0 0 12px #00ffff; transition:0.3s; }
button:hover { box-shadow:0 0 22px #00ffff; transform: scale(1.05); }
</style>
</head>
<body>

<!-- 🎉 CONFETTI SCRIPT -->
<script>
for(let i=0;i<80;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.animationDuration=(3+Math.random()*4)+"s";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  document.body.appendChild(c);
}
</script>

<header>🤖 Eyad Nintendo Ali AI</header>

<div id="chat">
  <div id="messages">
    <div class="msg ai">Hello 👋 I am Eyad Nintendo Ali AI!<br>Ask me for Unity code, Minecraft commands, or say "open games".</div>
  </div>
  <div id="inputBox">
    <input id="input" placeholder="Message AI..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const messages = document.getElementById("messages");

// Add message to chat
function addMessage(text, cls){
  const div=document.createElement("div");
  div.className="msg "+cls;
  div.innerHTML=text.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

// Send function
async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;
  addMessage(text,"user");
  input.value = "";
  addMessage("Typing...","ai");

  try{
    // Special new game response
    if(text.toLowerCase().includes("new game") || text.toLowerCase().includes("coming soon")){
      messages.lastChild.remove();
      addMessage("🎮 Game Haven domdom 2","ai");

      const videoDiv = document.createElement("div");
      videoDiv.className="msg ai";
      videoDiv.innerHTML = `
        <iframe width="100%" height="315" src="https://www.youtube.com/embed/_159DMDqFSM" 
        title="YouTube video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      messages.appendChild(videoDiv);
      messages.scrollTop = messages.scrollHeight;
      return;
    }

    // GPT-5 / GPT-4 API
    const response = await fetch("http://localhost:3000/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text})
    });
    const data = await response.json();
    messages.lastChild.remove();
    addMessage(data.choices[0].message.content,"ai");

  }catch(err){
    messages.lastChild.innerText="Error contacting GPT API. Check server or internet.";
    console.error(err);
  }
}
</script>

</body>
</html>
