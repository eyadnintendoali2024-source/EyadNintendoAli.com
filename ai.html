<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali AI – 2026 Party</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff00cc, #3333ff);
  color: white;
  overflow-x: hidden;
}

/* 🎉 Confetti */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

/* Header */
header {
  background: linear-gradient(90deg, #ff00cc, #3333ff);
  padding: 15px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

/* Chat box */
#chatBox {
  max-width: 900px;
  margin: 30px auto;
  background: rgba(0,0,0,0.35);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
}

#messages {
  height: 400px;
  overflow-y: auto;
  padding: 10px;
}

/* Messages */
.msg {
  margin: 10px 0;
  padding: 10px 14px;
  border-radius: 12px;
  max-width: 70%;
  animation: pop 0.3s ease;
}
@keyframes pop {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.user {
  background: #ffffff;
  color: black;
  margin-left: auto;
}

.ai {
  background: #ff00cc;
}

/* Input area */
#inputArea {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  background: white;
  color: #ff00cc;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  transform: scale(1.1);
}

/* Footer */
footer {
  text-align: center;
  margin: 20px;
  opacity: 0.8;
}
</style>
</head>

<body>

<header>
🤖 Eyad Nintendo Ali AI 🎉 | 2026 PARTY
</header>

<div id="chatBox">
  <div id="messages">
    <div class="msg ai">
      Hello 👋 I am <b>Eyad Nintendo Ali AI</b> 🤖<br>
      Ready for the 2026 party! 🎉🔥
    </div>
  </div>

  <div id="inputArea">
    <input id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send 🚀</button>
  </div>
</div>

<footer>
Powered by AI • Eyad Nintendo Ali © 2026
</footer>

<!-- 🎉 Confetti Script -->
<script>
for (let i = 0; i < 70; i++) {
  let c = document.createElement("div");
  c.className = "confetti";
  c.style.left = Math.random() * 100 + "vw";
  c.style.animationDuration = (3 + Math.random() * 4) + "s";
  c.style.background = `hsl(${Math.random()*360},100%,50%)`;
  document.body.appendChild(c);
}

/* Fake AI logic */
function aiReply(text) {
  const replies = [
    "🔥 2026 is going to be crazy!",
    "🎮 I love games! Tell me more.",
    "🤖 I'm Eyad Nintendo Ali AI!",
    "🚀 Ready for the future!",
    "😄 Nice to talk with you!"
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

function send() {
  let input = document.getElementById("userInput");
  let msg = input.value.trim();
  if (!msg) return;

  let messages = document.getElementById("messages");

  let userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.innerText = msg;
  messages.appendChild(userMsg);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  setTimeout(() => {
    let aiMsg = document.createElement("div");
    aiMsg.className = "msg ai";
    aiMsg.innerText = aiReply(msg);
    messages.appendChild(aiMsg);
    messages.scrollTop = messages.scrollHeight;
  }, 700);
}
</script>

</body>
</html>
