<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali AI</title>
<style>
body {
  margin:0; font-family: Arial; background:#0f0f0f; color:white;
}
header { text-align:center; padding:15px; font-size:24px; font-weight:bold; background:#222; }
#chat { max-width:900px; margin:20px auto; padding:20px; background:rgba(0,0,0,0.35); border-radius:16px; }
#messages { height:400px; overflow-y:auto; }
.msg { margin:10px 0; padding:12px; border-radius:12px; max-width:80%; line-height:1.5; }
.user { background:white; color:black; margin-left:auto; }
.ai { background:#222; }
pre { background:#111; padding:12px; border-radius:10px; overflow-x:auto; color:#00ffcc; }
#inputBox { display:flex; gap:10px; margin-top:15px; }
input { flex:1; padding:12px; border-radius:10px; border:none; font-size:16px; }
button { padding:12px 18px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>

<header>🤖 Eyad Nintendo Ali AI</header>

<div id="chat">
  <div id="messages">
    <div class="msg ai">Hello 👋 I am Eyad Nintendo Ali AI!<br>Ask me for Unity code, Minecraft commands, or say "open games".</div>
  </div>

  <div id="inputBox">
    <input id="input" placeholder="Message AI..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
// ====== YOUR OPENAI KEY HERE ======
const OPENAI_KEY = "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";

const messages = document.getElementById("messages");

function addMessage(text, cls){
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = text.replace(/```([\s\S]*?)```/g,"<pre><code>$1</code></pre>");
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;
  addMessage(text,"user");
  input.value="";
  addMessage("Typing...","ai");

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": `Bearer ${OPENAI_KEY}`
      },
      body: JSON.stringify({
        model:"gpt-5", // GPT-5 model
        messages:[
          { role: "system", content: "You are Eyad Nintendo Ali AI, helpful and fun." },
          { role: "user", content: text }
        ],
        max_tokens: 1000
      })
    });
    const data = await response.json();
    messages.lastChild.remove(); // remove "Typing..."
    addMessage(data.choices[0].message.content,"ai");
  } catch(err) {
    messages.lastChild.innerText = "Error contacting GPT API. Check your key or internet connection.";
    console.error(err);
  }
}
</script>

</body>
</html>
