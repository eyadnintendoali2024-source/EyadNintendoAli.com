<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali - Games, Cartoons, Movies & More</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #fff;
  overflow: hidden;
}

/* Intro Stage */
#intro {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: row;
  gap: 50px;
  z-index: 9999;
}
#intro img {
  width: 200px;
  transition: opacity 1s ease;
}
#intro h1 {
  font-size: 32px;
  color: #e60012;
  text-align: center;
  animation: fadeInOut 2s ease infinite alternate;
}
@keyframes fadeInOut { 0% {opacity: 1;} 100% {opacity: 0.3;} }

/* Loading Video Stage */
#loadingVideo {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  background-color: black;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9998;
}
#loadingVideo video {
  width: 60%;
  border-radius: 10px;
}
#loadingVideo h2 {
  color: white;
  margin-top: 20px;
  font-size: 24px;
  animation: blink 1.2s infinite;
}
@keyframes blink { 50% {opacity: 0.5;} }

/* Website hidden at start */
#site { display: none; }

/* Main site styles */
header {
  background-color: #e60012;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 25px;
  color: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.logo { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
.logo a { color: white; text-decoration: none; }
nav { display: flex; align-items: center; gap: 15px; }
button {
  background-color: white;
  color: #e60012;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
}
button:hover { background-color: #ffe5e5; }
.dropdown { position: relative; display: inline-block; }
.dropdown-content {
  display: none;
  position: absolute;
  background-color: white;
  min-width: 120px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  border-radius: 6px;
  z-index: 1;
}
.dropdown-content a {
  color: #e60012;
  padding: 8px 12px;
  display: block;
  text-decoration: none;
  font-weight: bold;
}
.dropdown-content a:hover { background-color: #ffe5e5; }
.dropdown:hover .dropdown-content { display: block; }
.youtube-btn { display: flex; align-items: center; gap: 6px; }

/* Game/Cartoon thumbnails */
.wrap { max-width: 1000px; margin: 40px auto; padding: 0 16px; display: flex; gap: 24px; flex-wrap: wrap; }
.wrap div { flex: 1 1 300px; border: 1px solid #ccc; padding: 10px; text-align: center; border-radius: 8px; }
.wrap img { width: 100%; border-radius: 6px; }
</style>
</head>
<body>

<!-- Intro -->
<div id="intro">
  <img src="mario.png" alt="Mario">
  <h1>Welcome to Eyad Nintendo Ali /</h1>
  <img src="luigi.png" alt="Luigi">
</div>

<!-- Loading Video -->
<div id="loadingVideo">
  <video id="loadVid" autoplay muted></video>
  <h2>Loading...</h2>
</div>

<!-- Website -->
<div id="site">
<header>
  <div class="logo"><a href="index.html">Eyad Nintendo Ali</a></div>
  <nav>
    <div class="dropdown">
      <button>🎮 Types ▾</button>
      <div class="dropdown-content">
        <a href="games.html">Games</a>
        <a href="cartoons.html">Cartoons</a>
        <a href="Movies.html">Movies</a>
        <a href="news.html">News</a>
      </div>
    </div>
    <button>🔍 Search</button>
    <button>📤 Share</button>
    <button class="youtube-btn" onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025', '_blank')">▶️ YouTube</button>
  </nav>
</header>

<div class="wrap">
  <div>
    <img src="game1.png" alt="Game 1">
    <p>Game 1</p>
  </div>
  <div>
    <img src="cartoon1.png" alt="Cartoon 1">
    <p>Cartoon 1</p>
  </div>
  <div>
    <img src="game2.png" alt="Game 2">
    <p>Game 2</p>
  </div>
  <div>
    <img src="cartoon2.png" alt="Cartoon 2">
    <p>Cartoon 2</p>
  </div>
</div>
</div>

<script>
// Check if site was already loaded before
if(localStorage.getItem('siteLoaded')) {
  document.getElementById('site').style.display = 'block';
  document.body.style.overflow = 'auto';
} else {
  // Show intro for 10 seconds
  setTimeout(() => {
    document.getElementById('intro').style.display = 'none';
    
    // Show loading video
    const loading = document.getElementById('loadingVideo');
    loading.style.display = 'flex';

    const vid = document.getElementById('loadVid');
    vid.src = Math.random() < 0.5 ? 'loading.mp4' : 'loading2.mp4';

    // Wait until all images/videos in the site are fully loaded
    const site = document.getElementById('site');
    const images = site.querySelectorAll('img');
    let loadedCount = 0;

    function checkAllLoaded() {
      loadedCount++;
      if(loadedCount >= images.length) {
        // Hide loading video and show site
        vid.pause();
        loading.style.display = 'none';
        site.style.display = 'block';
        document.body.style.overflow = 'auto';
        localStorage.setItem('siteLoaded', 'true');
      }
    }

    if(images.length === 0) {
      checkAllLoaded();
    } else {
      images.forEach(img => {
        if(img.complete) checkAllLoaded();
        else img.addEventListener('load', checkAllLoaded);
      });
    }
  }, 10000); // 10s intro
}
</script>

</body>
</html>
