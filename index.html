<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ff00cc,#3333ff);
  color:white;
  overflow-x:hidden;
}
/* 🎉 CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
  opacity: 0.8;
  border-radius:50%;
}
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

/* Header */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 25px;
  background:#222;
  color:white;
  text-shadow:0 0 10px #fff;
}
header .logo { font-size:24px; font-weight:bold; letter-spacing:1px; }
header .logo a { color:white; text-decoration:none; }
nav { display:flex; align-items:center; gap:15px; }
button {
  background:white;
  color:#e60012;
  border:none;
  border-radius:6px;
  padding:8px 14px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}
button:hover { background:#ffe5e5; }

/* Dropdown */
.dropdown { position:relative; display:inline-block; }
.dropdown-content {
  display:none;
  position:absolute;
  background:white;
  min-width:120px;
  box-shadow:0 8px 16px rgba(0,0,0,0.2);
  border-radius:6px;
  z-index:1;
}
.dropdown-content a {
  color:#e60012;
  padding:8px 12px;
  display:block;
  text-decoration:none;
  font-weight:bold;
}
.dropdown-content a:hover { background:#ffe5e5; }
.dropdown:hover .dropdown-content { display:block; }

/* Music button */
.mute-btn {
  background:#fff;
  color:#e60012;
  border-radius:50%;
  padding:6px 10px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  transition:.3s;
}
.mute-btn:hover { background:#ffe5e5; }

/* Section */
.section { max-width:1000px; margin:40px auto; padding:0 16px; display:flex; flex-wrap:wrap; gap:24px; }
.card {
  flex:1 1 300px;
  background:rgba(255,255,255,0.1);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}
.card:hover { transform:scale(1.03); }
.card img { width:100%; display:block; }
.card h3 { margin:0; padding:12px; color:#fff; font-size:20px; background:rgba(0,0,0,0.3); text-align:center; }

</style>
</head>
<body>

<!-- 🎉 CONFETTI SCRIPT -->
<script>
for(let i=0;i<80;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.width=c.style.height=(Math.random()*10+5)+"px";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  c.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(c);
}
</script>

<!-- Background music -->
<audio id="bgMusic" src="Game Haven domdom.mp3" loop></audio>

<header>
  <div class="logo"><a href="index.html">Eyad Nintendo Ali</a></div>
  <nav>
    <div class="dropdown">
      <button>🎮 Types ▾</button>
      <div class="dropdown-content">
        <a href="games.html">Games</a>
        <a href="cartoons.html">Cartoons</a>
        <a href="movies.html">Movies</a>
        <a href="news.html">News</a>
      </div>
    </div>
    <button onclick="document.getElementById('bgMusic').play()">🔊 Play Music</button>
    <button class="mute-btn" id="muteBtn">🔇</button>
    <button class="youtube-btn" onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025','_blank')">▶️ YouTube</button>
  </nav>
</header>

<div class="section">
  <div class="card" onclick="window.location.href='games.html'">
    <img src="Game Haven domdom.png" alt="Game Haven domdom">
    <h3>Games</h3>
  </div>
  <div class="card" onclick="window.location.href='cartoons.html'">
    <img src="https://img.youtube.com/vi/wNGg4iQ5NjU/hqdefault.jpg" alt="Cartoons">
    <h3>Cartoons</h3>
  </div>
  <div class="card" onclick="window.location.href='movies.html'">
    <img src="movies.png" alt="Movies">
    <h3>Movies</h3>
  </div>
  <div class="card" onclick="window.location.href='news.html'">
    <img src="news.png" alt="News">
    <h3>News</h3>
  </div>
</div>

<script>
// Mute/unmute music
const music = document.getElementById('bgMusic');
const btn = document.getElementById('muteBtn');

window.addEventListener('load',()=>{ music.play().catch(()=>{}) });
btn.addEventListener('click',()=>{
  music.muted = !music.muted;
  btn.textContent = music.muted ? '🔇' : '🔊';
});
</script>

</body>
</html>
