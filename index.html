<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali - Games, Cartoons, Movies & More</title>

<!-- SEO meta tags -->
<meta name="description" content="Explore Eyad Nintendo Ali website with games, cartoons, movies, and more!">
<meta name="keywords" content="Eyad Nintendo Ali, games, cartoons, movies, play online, YouTube">
<meta name="author" content="Eyad Nintendo Ali">

<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #fff;
  overflow: hidden;
}

/* Loading Intro */
#intro {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: row;
  gap: 50px;
  z-index: 9999;
}

#intro img {
  width: 200px;
  transition: opacity 1s ease;
}

#intro h1 {
  font-size: 32px;
  color: #e60012;
  text-align: center;
  animation: fadeInOut 2s ease infinite alternate;
}

@keyframes fadeInOut {
  0% {opacity: 1;}
  100% {opacity: 0.3;}
}

/* Loading video */
#loadingVideo {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  background-color: black;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9998;
}

#loadingVideo video {
  width: 60%;
  border-radius: 10px;
}

#loadingVideo h2 {
  color: white;
  margin-top: 20px;
  font-size: 24px;
  animation: blink 1.2s infinite;
}

@keyframes blink {
  50% {opacity: 0.5;}
}

/* Website hidden at start */
#site {
  display: none;
}

/* Main site styles */
header {
  background-color: #e60012;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 25px;
  color: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.logo {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}
.logo a {
  color: white;
  text-decoration: none;
}
nav {
  display: flex;
  align-items: center;
  gap: 15px;
}
button {
  background-color: white;
  color: #e60012;
  border: none;
  border-radius: 6px;
  padding: 8px 14px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  align-items: center;
  gap: 6px;
}
button:hover {
  background-color: #ffe5e5;
}
.dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-content {
  display: none;
  position: absolute;
  background-color: white;
  min-width: 120px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
  border-radius: 6px;
  z-index: 1;
}
.dropdown-content a {
  color: #e60012;
  padding: 8px 12px;
  display: block;
  text-decoration: none;
  font-weight: bold;
}
.dropdown-content a:hover {
  background-color: #ffe5e5;
}
.dropdown:hover .dropdown-content {
  display: block;
}
.youtube-btn {
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>

<body>
<!-- Intro (Mario, Luigi, Text) -->
<div id="intro">
  <img src="mario.png" alt="Mario">
  <h1>Welcome to Eyad Nintendo Ali /</h1>
  <img src="luigi.png" alt="Luigi">
</div>

<!-- Loading Video -->
<div id="loadingVideo">
  <video id="loadVid" autoplay muted></video>
  <h2>Loading...</h2>
</div>

<!-- Website -->
<div id="site">
<header>
  <div class="logo"><a href="index.html">Eyad Nintendo Ali</a></div>
  <nav>
    <div class="dropdown">
      <button>🎮 Types ▾</button>
      <div class="dropdown-content">
        <a href="games.html">Games</a>
        <a href="cartoons.html">Cartoons</a>
        <a href="Movies.html">Movies</a>
        <a href="news.html">News</a>
      </div>
    </div>
    <button>🔍 Search</button>
    <button>📤 Share</button>
    <button class="youtube-btn" onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025', '_blank')">▶️ YouTube</button>
  </nav>
</header>

<div style="max-width:1000px; margin:40px auto; padding:0 16px;">
  <h1>Welcome to Eyad Nintendo Ali</h1>
  <p>Use the menu above to navigate to Games, Cartoons, Movies, and more.</p>
</div>
</div>

<script>
// Step 1: After 10s, hide intro and show random video
setTimeout(() => {
  document.getElementById('intro').style.display = 'none';
  const loading = document.getElementById('loadingVideo');
  loading.style.display = 'flex';

  // Random video (1 or 2)
  const vid = document.getElementById('loadVid');
  const randomVideo = Math.random() < 0.5 ? 'loading.mp4' : 'loading2.mp4';
  vid.src = randomVideo;

  // Step 2: when video ends, show site
  vid.onended = () => {
    loading.style.display = 'none';
    document.body.style.overflow = 'auto';
    document.getElementById('site').style.display = 'block';
  };
}, 10000);
</script>
</body>
</html>
