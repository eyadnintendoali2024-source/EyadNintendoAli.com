<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyad Nintendo Ali - Space</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1026, #000000);
      color: white;
      overflow-x: hidden;
    }
    a { color: inherit; }
    header {
      position: relative;
      z-index: 10;
      background: rgba(0,0,40,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ccff;
    }
    .logo a {
      color: white;
      text-decoration: none;
    }
    nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid #00ccff;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
      background: #00ccff;
      color: black;
    }
    .dropdown {
      position: relative;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #111844;
      border-radius: 8px;
      min-width: 190px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      z-index: 100;
    }
    .dropdown-content a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: white;
    }
    .dropdown:hover .dropdown-content { display: block; }
    .dropdown-content a:hover {
      background: #00ccff;
      color: black;
    }
    .sas-btn {
      display: none;
      background: linear-gradient(90deg, #00ccff, #0044ff);
      color: white;
      box-shadow: 0 0 12px #00ccff;
    }
    .sas-btn.visible { display: inline-flex; }
    .section {
      max-width: 1000px;
      margin: 50px auto;
      padding: 24px;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #settingsModalOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    #settingsModalOverlay.active { display: flex; }
    .settings-modal {
      background: radial-gradient(circle at top, #0b1026, #050814);
      border: 2px solid #00ccff;
      box-shadow: 0 0 25px #00ccff;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      color: white;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 204, 255, 0.3);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .settings-header h2 {
      margin: 0;
      font-size: 22px;
      color: #00ccff;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #00ccff;
      font-size: 24px;
      cursor: pointer;
    }
    .settings-section {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(0, 204, 255, 0.2);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 18px;
    }
    .settings-section h3 { margin-top: 0; color: #00ccff; }
    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .settings-input {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid #00ccff;
      color: white;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
    }
    .code-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
    }
    .code-status { font-size: 13px; color: #aaa; margin-top: 4px; }
    .code-status .enabled { color: #00ff66; font-weight: bold; }
    .error-msg {
      color: #ff3366;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html">Eyad Nintendo Ali 🚀</a>
    </div>

    <nav>
      <div class="dropdown">
        <button>🌌 Types ▾</button>
        <div class="dropdown-content">
          <a href="minecraft.html">⛏️ Minecraft</a>
          <a href="cockatiel-online.html">🐦 Cockatiel Bird Online List</a>
          <a href="games.html">🎮 Games</a>
          <a href="Movies.html">🎬 Movies</a>
          <a href="cartoons.html">📺 Cartoons</a>
          <a href="news.html">📰 News</a>
        </div>
      </div>

      <button id="sasGameBtn" class="sas-btn" onclick="location.href='SAS/SAS.html'">🎮 Play SAS Game</button>
      <button class="ai-btn" onclick="location.href='ai.html'">🤖 AI</button>
      <button class="ai-btn" onclick="location.href='Football.html'">⚽ Football</button>
      <button onclick="openSettings()">⚙️ Settings</button>
    </nav>
  </header>

  <div class="section">
    <h1>🌌 SPACE MODE 🌌</h1>
    <p>Explore the universe of games, fun, and creativity.</p>
  </div>

  <div id="settingsModalOverlay" onclick="closeSettingsOnBackdrop(event)">
    <div class="settings-modal">
      <div class="settings-header">
        <h2>⚙️ SETTINGS</h2>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>

      <div class="settings-section">
        <h3>👤 Username</h3>
        <div id="usernameDisplayArea">
          <span id="usernameText">Username: Not set</span>
          <button style="margin-left: 10px;" id="usernameActionBtn" onclick="toggleUsernameInput()">Set Username</button>
        </div>
        <div id="usernameInputArea" style="display: none;" class="input-group">
          <input type="text" id="usernameInput" class="settings-input" placeholder="Enter username">
          <button onclick="saveUsername()">💾 Save</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>📋 Code List</h3>
        <div id="codeListContent">
          <p style="font-size: 13px; color: #aaa; margin: 0;">No codes unlocked yet.</p>
        </div>
      </div>

      <div class="settings-section">
        <button id="toggleCodeBtn" onclick="toggleCodeInput()" style="width: 100%;">🔑 Enter Code</button>
        <div id="codeInputArea" style="display: none; margin-top: 10px;">
          <div class="input-group">
            <input type="text" id="codeInput" class="settings-input" placeholder="Enter code">
            <button onclick="submitCode()">Enter</button>
          </div>
          <div id="codeError" class="error-msg">❌ Invalid code</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getUnlockedCodes() {
      try {
        return JSON.parse(localStorage.getItem("unlockedCodes") || "[]");
      } catch {
        return [];
      }
    }

    function updateSASButton() {
      const btn = document.getElementById("sasGameBtn");
      if (!btn) return;
      const unlocked = getUnlockedCodes();
      btn.style.display = unlocked.includes("2511") ? "inline-flex" : "none";
    }

    function openSettings() {
      document.getElementById("settingsModalOverlay").classList.add("active");
      renderSettings();
    }

    function closeSettings() {
      document.getElementById("settingsModalOverlay").classList.remove("active");
      document.getElementById("codeInputArea").style.display = "none";
      document.getElementById("usernameInputArea").style.display = "none";
      document.getElementById("usernameDisplayArea").style.display = "block";
      document.getElementById("codeError").style.display = "none";
    }

    function closeSettingsOnBackdrop(e) {
      if (e.target.id === "settingsModalOverlay") closeSettings();
    }

    function renderSettings() {
      const savedUsername = localStorage.getItem("siteUsername");
      const usernameText = document.getElementById("usernameText");
      const usernameActionBtn = document.getElementById("usernameActionBtn");
      usernameText.textContent = savedUsername ? "Username: " + savedUsername : "Username: Not set";
      usernameActionBtn.textContent = savedUsername ? "✏️ Rename" : "Set Username";

      const unlockedCodes = getUnlockedCodes();
      const codeListContent = document.getElementById("codeListContent");
      codeListContent.innerHTML = "";

      if (unlockedCodes.length === 0) {
        codeListContent.innerHTML = '<p style="font-size: 13px; color: #aaa; margin: 0;">No codes unlocked yet.</p>';
      } else {
        if (unlockedCodes.includes("2511")) {
          const item = document.createElement("div");
          item.className = "code-item";
          item.innerHTML = `
            <div>
              <div>🎮 SAS Game</div>
              <div class="code-status">Status: <span class="enabled">Unlocked</span></div>
            </div>
            <button onclick="location.href='SAS/SAS.html'">Play</button>
          `;
          codeListContent.appendChild(item);
        }

        if (unlockedCodes.includes("20112015")) {
          const item = document.createElement("div");
          item.className = "code-item";
          item.innerHTML = `
            <div>
              <div>🛠️ Creator Mode</div>
              <div class="code-status">Status: <span class="enabled">Unlocked</span></div>
            </div>
            <button onclick="location.reload()">Open</button>
          `;
          codeListContent.appendChild(item);
        }
      }

      updateSASButton();
    }

    function toggleUsernameInput() {
      const displayArea = document.getElementById("usernameDisplayArea");
      const inputArea = document.getElementById("usernameInputArea");
      const usernameInput = document.getElementById("usernameInput");
      usernameInput.value = localStorage.getItem("siteUsername") || "";
      displayArea.style.display = "none";
      inputArea.style.display = "flex";
      usernameInput.focus();
    }

    function saveUsername() {
      const input = document.getElementById("usernameInput").value.trim();
      if (input) localStorage.setItem("siteUsername", input);
      document.getElementById("usernameInputArea").style.display = "none";
      document.getElementById("usernameDisplayArea").style.display = "block";
      renderSettings();
    }

    function toggleCodeInput() {
      const inputArea = document.getElementById("codeInputArea");
      const errorMsg = document.getElementById("codeError");
      errorMsg.style.display = "none";
      if (inputArea.style.display === "none" || inputArea.style.display === "") {
        inputArea.style.display = "block";
        document.getElementById("codeInput").focus();
      } else {
        inputArea.style.display = "none";
      }
    }

    function submitCode() {
      const val = document.getElementById("codeInput").value.trim();
      const errorMsg = document.getElementById("codeError");
      const unlockedCodes = getUnlockedCodes();

      if (val === "2511") {
        if (!unlockedCodes.includes("2511")) unlockedCodes.push("2511");
        localStorage.setItem("unlockedCodes", JSON.stringify(unlockedCodes));
        document.getElementById("codeInput").value = "";
        errorMsg.style.display = "none";
        closeSettings();
        location.reload();
        return;
      }

      if (val === "20112015") {
        if (!unlockedCodes.includes("20112015")) unlockedCodes.push("20112015");
        localStorage.setItem("unlockedCodes", JSON.stringify(unlockedCodes));
        document.getElementById("codeInput").value = "";
        errorMsg.style.display = "none";
        closeSettings();
        location.reload();
        return;
      }

      errorMsg.style.display = "block";
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderSettings();
      updateSASButton();
    });
  </script>
</body>
</html>
