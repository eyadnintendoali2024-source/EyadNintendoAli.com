<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyad Nintendo Ali - 2026 Party</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff00cc, #3333ff);
  overflow-x: hidden;
  color: white;
}

/* 🎉 CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear infinite;
  opacity: 0.8;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

/* Intro screen */
#intro {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, #ff00cc, #000);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  z-index: 9999;
  text-align: center;
}
#intro img { width: 180px; }
#intro h1 {
  font-size: 36px;
  text-shadow: 0 0 15px #ff00cc;
  animation: pulse 1.5s infinite alternate;
}
@keyframes pulse {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(1.08); opacity: 0.85; }
}

/* Loading */
#loadingVideo {
  position: fixed;
  inset: 0;
  display: none;
  background: black;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9998;
}
#loadingVideo video {
  width: 60%;
  border-radius: 12px;
}
#loadingVideo h2 {
  margin-top: 20px;
  animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0.4; } }

/* Main site */
#site { display: none; }

/* Header */
header {
  background: linear-gradient(90deg, #ff00cc, #3333ff);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.logo {
  font-size: 26px;
  font-weight: bold;
  text-shadow: 0 0 10px #fff;
}
.logo a {
  color: white;
  text-decoration: none;
}

nav {
  display: flex;
  gap: 15px;
}

button {
  background: white;
  color: #ff00cc;
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  transform: scale(1.1);
}

/* 🤖 AI Button */
.ai-btn {
  background: linear-gradient(90deg, #00ffcc, #00ccff);
  color: black;
  box-shadow: 0 0 12px #00ffff;
}
.ai-btn:hover {
  box-shadow: 0 0 22px #00ffff;
}

/* Dropdown */
.dropdown { position: relative; }
.dropdown-content {
  display: none;
  position: absolute;
  background: white;
  border-radius: 8px;
  min-width: 120px;
}
.dropdown-content a {
  display: block;
  padding: 8px;
  text-decoration: none;
  color: #ff00cc;
}
.dropdown:hover .dropdown-content { display: block; }

/* Sections */
.section {
  max-width: 1000px;
  margin: 50px auto;
  padding: 20px;
  background: rgba(0,0,0,0.35);
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.card {
  width: 200px;
  background: white;
  color: black;
  border-radius: 12px;
  padding: 10px;
  cursor: pointer;
  transition: 0.3s;
}
.card:hover {
  transform: scale(1.08);
}
.card img {
  width: 100%;
  border-radius: 8px;
}
</style>
</head>

<body>

<!-- 🎉 CONFETTI SCRIPT -->
<script>
for (let i = 0; i < 80; i++) {
  let c = document.createElement("div");
  c.className = "confetti";
  c.style.left = Math.random() * 100 + "vw";
  c.style.animationDuration = (3 + Math.random() * 4) + "s";
  c.style.background = `hsl(${Math.random()*360},100%,50%)`;
  document.body.appendChild(c);
}
</script>

<!-- Intro -->
<div id="intro">
  <img src="mario.png">
  <h1>🎉 Welcome to Eyad Nintendo Ali 🎉<br>🔥 2026 PARTY 🔥</h1>
  <img src="luigi.png">
</div>

<!-- Loading -->
<div id="loadingVideo">
  <video id="loadVid" autoplay muted></video>
  <h2>Loading the Party...</h2>
</div>

<!-- Site -->
<div id="site">

<header>
  <div class="logo"><a href="index.html">Eyad Nintendo Ali 🎮</a></div>

  <nav>
    <div class="dropdown">
      <button>🎮 Types ▾</button>
      <div class="dropdown-content">
        <a href="#gamesSection">Games</a>
        <a href="cartoons.html">Cartoons</a>
        <a href="#moviesSection">Movies</a>
        <a href="#newsSection">News</a>
      </div>
    </div>

    <!-- 🤖 AI BUTTON -->
    <button class="ai-btn" onclick="location.href='ai.html'">🤖 AI</button>

    <button>🔍 Search</button>
    <button onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025','_blank')">▶️ YouTube</button>
  </nav>
</header>

<div class="section">
  <h1>🎉 2026 PARTY MODE 🎉</h1>
  <p>Welcome to the future of games, fun, and creativity.</p>
</div>

<div class="section" id="gamesSection">
  <h2>Games</h2>
  <div class="cards">
    <div class="card" onclick="location.href='Boy&jelly.html'">
      <img src="Boy&jelly.png">
      <p>Boy & Jelly</p>
    </div>
    <div class="card" onclick="location.href='Game Haven domdom.html'">
      <img src="Game Haven domdom.png">
      <p>Game Haven domdom</p>
    </div>
  </div>
</div>

</div>

<script>
if (sessionStorage.getItem("visitedHome")) {
  intro.style.display = "none";
  site.style.display = "block";
} else {
  setTimeout(() => {
    intro.style.display = "none";
    loadingVideo.style.display = "flex";
    loadVid.src = "loading.mp4";
    loadVid.onended = () => {
      loadingVideo.style.display = "none";
      site.style.display = "block";
      sessionStorage.setItem("visitedHome","1");
    };
  }, 8000);
}
</script>

</body>
</html>
