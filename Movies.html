<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies</title>
<link rel="icon" href="favicon.ico">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:#000 url("space wallpaper.jpg") center center fixed;
    background-size:cover;
}

header{
    background:#e60012;
    color:white;
    padding:18px 30px;
    font-size:30px;
    font-weight:bold;
    position:relative;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-size:18px;
    background:rgba(0,0,0,0.3);
    padding:8px 16px;
    border-radius:8px;
    transition:.3s;
}

.back-btn:hover{
    background:rgba(0,0,0,0.6);
}

.container{
    width:90%;
    max-width:1400px;
    margin:40px auto;
    position:relative;
    z-index:10;
}

.movies-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:30px;
}

.movie-card{
    background:rgba(0,0,0,0.6);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.6);
    transition:transform .3s, box-shadow .3s;
    text-decoration:none;
    color:white;
    display:flex;
    flex-direction:column;
}

.movie-card:hover{
    transform:translateY(-8px);
    box-shadow:0 10px 25px rgba(230,0,18,0.4);
}

.poster-wrapper{
    position:relative;
    width:100%;
    padding-top:140%;
    overflow:hidden;
    background:#111;
}

.poster-wrapper img{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .5s;
}

.movie-card:hover .poster-wrapper img{
    transform:scale(1.05);
}

.movie-details{
    padding:20px;
    display:flex;
    flex-direction:column;
    flex-grow:1;
}

.movie-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.movie-category{
    font-size:14px;
    color:#aaa;
    margin-bottom:12px;
}

.movie-status{
    display:inline-block;
    background:#e60012;
    color:white;
    padding:4px 10px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    align-self:flex-start;
    margin-top:auto;
}

.star{
    position:fixed;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 2s infinite alternate;
    z-index:-1;
    pointer-events:none;
}

@keyframes twinkle{
    from{
        opacity:.4;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1.1);
    }
}

#stars{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
}

@media(max-width:600px){
    .movies-grid{
        grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
        gap:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-title">
        🎬 Movies
    </div>
    <a href="index.html" class="back-btn">⬅ Home</a>
</header>

<div class="container">
    <div class="movies-grid">

        <!-- Angry Birds 2 -->
        <a href="Angry Birds 2.html" class="movie-card">
            <div class="poster-wrapper">
                <img src="Angry Birds 2.png" alt="Angry Birds 2" loading="lazy">
            </div>
            <div class="movie-details">
                <div class="movie-title">Angry Birds 2</div>
                <div class="movie-category">Animation</div>
                <div class="movie-status">Full Movie</div>
            </div>
        </a>

        <!-- Minecraft Movie -->
        <a href="Minecraft Movie.html" class="movie-card">
            <div class="poster-wrapper">
                <img src="Minecraft Movie.png" alt="Minecraft Movie" loading="lazy">
            </div>
            <div class="movie-details">
                <div class="movie-title">Minecraft Movie</div>
                <div class="movie-category">Action • Adventure</div>
                <div class="movie-status">Full Movie</div>
            </div>
        </a>

        <!-- Super Mario Bros. Movie -->
        <a href="Super Mario Bros. Movie.html" class="movie-card">
            <div class="poster-wrapper">
                <img src="Super Mario Bros. Movie.png" alt="Super Mario Bros. Movie" loading="lazy">
            </div>
            <div class="movie-details">
                <div class="movie-title">Super Mario Bros. Movie</div>
                <div class="movie-category">Animation • Adventure</div>
                <div class="movie-status">Full Movie</div>
            </div>
        </a>

        <!-- Toy Story 5 -->
        <a href="Toy 5.html" class="movie-card">
            <div class="poster-wrapper">
                <img src="Toy 5.png" alt="Toy Story 5" loading="lazy">
            </div>
            <div class="movie-details">
                <div class="movie-title">Toy Story 5</div>
                <div class="movie-category">Animation • Adventure • Family • Comedy</div>
                <div class="movie-status">Full Movie</div>
            </div>
        </a>

    </div>
</div>

<script>
const stars=document.createElement("div");
stars.id="stars";
document.body.prepend(stars);

for(let i=0;i<60;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";

    let size=Math.random()*2+1;

    s.style.width=size+"px";
    s.style.height=size+"px";

    stars.appendChild(s);
}
</script>

</body>
</html>
