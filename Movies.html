<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies - Eyad Nintendo Ali</title>
<link rel="icon" href="favicon.ico">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:radial-gradient(circle at top,#0b1026,#000);
    color:white;
    overflow-x:hidden;
}

/* Stars */
.star{
    position:fixed;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.3;}
    to{opacity:1;}
}

/* Header */
header{
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:rgba(0,0,40,.85);
    backdrop-filter:blur(10px);
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#00ccff;
    text-shadow:0 0 10px #00ccff;
}

.logo a{
    color:white;
    text-decoration:none;
}

.search{
    width:300px;
    padding:10px;
    border:none;
    border-radius:25px;
    outline:none;
    font-size:16px;
}

/* Featured */
.hero{
    height:420px;
    background:url("Minecraft Movie.png") center/cover;
    display:flex;
    align-items:flex-end;
    padding:40px;
    box-shadow:inset 0 -120px 120px rgba(0,0,0,.9);
}

.hero h1{
    font-size:48px;
    text-shadow:0 0 20px black;
}

.hero p{
    font-size:18px;
    max-width:600px;
    margin-top:10px;
}

/* Movies */
.section{
    padding:30px;
}

.section h2{
    margin-bottom:20px;
    color:#00ccff;
}

.movies{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    width:240px;
    background:#111;
    border-radius:12px;
    overflow:hidden;
    transition:.3s;
    cursor:pointer;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}

.card:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px #00ccff;
}

.card img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
}

.card h3{
    padding:10px;
}

.card p{
    padding:0 10px 15px;
    color:#bbb;
}

.coming{
    display:inline-block;
    background:red;
    padding:5px 10px;
    border-radius:6px;
    margin:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<script>
for(let i=0;i<180;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 let size=Math.random()*3+1;
 s.style.width=size+"px";
 s.style.height=size+"px";
 s.style.animationDuration=(1+Math.random()*3)+"s";
 document.body.appendChild(s);
}
</script>
<header>
    <div class="logo">
        <a href="index.html">🚀 Eyad Nintendo Ali</a>
    </div>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="🔍 Search movies..."
        onkeyup="searchMovies()">
</header>

<div class="hero">
    <div>
        <h1>🎬 Minecraft Movie</h1>
        <p>
            Welcome to the Movies section! Watch your favorite movies with
            a Netflix and YouTube style interface.
        </p>
    </div>
</div>

<div class="section">

<h2>🍿 Movies</h2>

<div class="movies" id="movieList">

<div class="card" onclick="location.href='ABM2.html'">
    <img src="Angry Birds 2.png" alt="Angry Birds 2">
    <h3>Angry Birds 2</h3>
    <p>Full Movie</p>
</div>

<div class="card" onclick="location.href='ABM3.html'">
    <img src="Angry Birds 3.png" alt="Angry Birds 3">
    <span class="coming">COMING SOON</span>
    <h3>Angry Birds 3</h3>
    <p>Coming Soon</p>
</div>

<div class="card" onclick="location.href='Mine M.html'">
    <img src="Minecraft Movie.png" alt="Minecraft Movie">
    <h3>Minecraft Movie</h3>
    <p>Adventure Movie</p>
</div>

<div class="card" onclick="location.href='SMG.html'">
    <img src="Super Mario Galaxy.png" alt="Super Mario Galaxy">
    <h3>Super Mario Galaxy</h3>
    <p>Animated Movie</p>
</div>

</div>
</div>

<script>
function searchMovies(){
    let input=document.getElementById("search").value.toLowerCase();
    let cards=document.querySelectorAll(".card");

    cards.forEach(card=>{
        let title=card.querySelector("h3").textContent.toLowerCase();

        if(title.includes(input)){
            card.style.display="block";
        }else{
            card.style.display="none";
        }
    });
}
</script>

</body>
</html>
