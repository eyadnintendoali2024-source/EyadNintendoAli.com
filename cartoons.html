<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartoons - Space Edition</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
:root {
  --blue:#00ccff;
  --dark:#001133;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background: radial-gradient(circle at top, #0b1026, #000000);
  color:white;
  overflow-x:hidden;
}

/* 🌌 STARS */
.star {
  position: fixed;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity:0.3; }
  to { opacity:1; }
}

/* HEADER */
header {
  background: rgba(0,0,40,0.8);
  backdrop-filter: blur(8px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 25px;
  color:white;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
}

header .logo {
  font-size:24px;
  font-weight:bold;
  letter-spacing:1px;
  text-shadow:0 0 10px #00ccff;
}

header .logo a {
  color:white;
  text-decoration:none;
}

nav {
  display:flex;
  align-items:center;
  gap:15px;
}

/* BUTTONS */
button {
  background: rgba(255,255,255,0.1);
  color:white;
  border:1px solid #00ccff;
  border-radius:8px;
  padding:8px 14px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  display:flex;
  align-items:center;
  gap:6px;
}

button:hover {
  transform:scale(1.08);
  background:#00ccff;
  color:black;
}

/* DROPDOWN */
.dropdown {
  position:relative;
  display:inline-block;
}

.dropdown-content {
  display:none;
  position:absolute;
  background:#111844;
  min-width:150px;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
  z-index:1;
}

.dropdown-content a {
  color:white;
  padding:10px 12px;
  display:block;
  text-decoration:none;
  font-weight:bold;
  transition:.3s;
}

.dropdown-content a:hover {
  background:#00ccff;
  color:black;
}

.dropdown:hover .dropdown-content {
  display:block;
}

/* PLAYER */
.wrap {
  max-width:1100px;
  margin:30px auto;
  padding:0 16px;
}

.player {
  background:#000;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 25px rgba(0,204,255,0.4);
}

.player iframe {
  width:100%;
  height:540px;
  border:0;
  display:block;
}

/* LIST */
.list {
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.item {
  display:flex;
  gap:14px;
  align-items:center;
  background:rgba(255,255,255,0.05);
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(5px);
}

.item:hover {
  transform:scale(1.02);
  background:rgba(0,204,255,0.12);
  box-shadow:0 0 15px rgba(0,204,255,0.3);
}

.number-badge {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#00ccff;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
  flex-shrink:0;
  box-shadow:0 0 15px #00ccff;
}

.thumb {
  width:220px;
  height:130px;
  flex:0 0 220px;
  border-radius:10px;
  overflow:hidden;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow:0 0 15px rgba(0,204,255,0.2);
}

.thumb img {
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.play-overlay::after {
  content:'▶';
  position:absolute;
  left:14px;
  top:8px;
  font-size:30px;
  color:white;
  text-shadow:0 2px 6px rgba(0,0,0,0.8);
}

/* MOBILE */
@media (max-width:720px) {

  .player iframe {
    height:260px;
  }

  .thumb {
    width:140px;
    height:88px;
    flex:0 0 140px;
  }

}
</style>
</head>

<body>

<!-- 🌌 STARS -->
<script>
for (let i = 0; i < 180; i++) {

  let s = document.createElement("div");

  s.className = "star";

  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";

  let size = Math.random() * 3 + 1;

  s.style.width = size + "px";
  s.style.height = size + "px";

  s.style.animationDuration = (1 + Math.random() * 3) + "s";

  document.body.appendChild(s);
}
</script>

<!-- HEADER -->
<header>

  <div class="logo">
    <a href="index.html">Eyad Nintendo Ali 🚀</a>
  </div>

  <nav>

    <div class="dropdown">

      <button>🌌 Types ▾</button>

      <div class="dropdown-content">

        <a href="minecraft.html">⛏️ Minecraft</a>

        <a href="games.html">🎮 Games</a>

        <a href="cartoons.html">📺 Cartoons</a>

        <a href="Movies.html">🎬 Movies</a>

        <a href="news.html">📰 News</a>

      </div>

    </div>

    <button>🔍 Search</button>

    <button>📤 Share</button>

    <button onclick="window.open('https://www.youtube.com/@EyadNintendoAli2025', '_blank')">
      ▶️ YouTube
    </button>

  </nav>

</header>

<!-- PLAYER -->
<div class="wrap">

  <div class="player" id="playerWrap">

    <iframe
      id="player"
      src="https://www.youtube.com/embed/wNGg4iQ5NjU?list=PL9zzIDvnJ117FxJRL7Kb_I2XK0aizp-Xr&autoplay=0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
      title="Cartoons Playlist">
    </iframe>

  </div>

  <!-- VIDEO LIST -->
  <div class="list" id="videoList">

    <div class="item" data-video-id="wNGg4iQ5NjU">
      <div class="number-badge">1</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/wNGg4iQ5NjU/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="dT2TQ8MQ6lY">
      <div class="number-badge">2</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/dT2TQ8MQ6lY/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="_hHvTQsUZeE">
      <div class="number-badge">3</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/_hHvTQsUZeE/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="dpiCuVw-iJk">
      <div class="number-badge">4</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/dpiCuVw-iJk/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="ssiPByu8vxI">
      <div class="number-badge">5</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/ssiPByu8vxI/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="DRHb4lrpYm0">
      <div class="number-badge">6</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/DRHb4lrpYm0/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="LbjMRXaov4Q">
      <div class="number-badge">7</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/LbjMRXaov4Q/hqdefault.jpg">
      </div>
    </div>

    <div class="item" data-video-id="VUbtZ22nf-E">
      <div class="number-badge">8</div>
      <div class="thumb play-overlay">
        <img src="https://img.youtube.com/vi/VUbtZ22nf-E/hqdefault.jpg">
      </div>
    </div>

  </div>

</div>

<script>
const listEl = document.getElementById('videoList');
const player = document.getElementById('player');

listEl.addEventListener('click', e => {

  let el = e.target;

  while(el && !el.classList.contains('item')) {
    el = el.parentElement;
  }

  if(!el) return;

  const vid = el.getAttribute('data-video-id');

  player.src =
  `https://www.youtube.com/embed/${vid}?list=PL9zzIDvnJ117FxJRL7Kb_I2XK0aizp-Xr&autoplay=1`;

  player.scrollIntoView({
    behavior:'smooth',
    block:'center'
  });

});
</script>

</body>
</html>
