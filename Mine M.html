*{

body{

    color:#222;

header{

}

.info p{
    font-size:20px;
    margin:15px 0;
    color:#555;
}

.watch{
    display:block;
    margin-top:30px;
    background:#e60012;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
}

.watch:hover{
    background:#c40010;
}

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;

    font-size:20px;
