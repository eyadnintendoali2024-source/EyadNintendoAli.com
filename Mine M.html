<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Movie</title>
<link rel="icon" href="favicon.ico">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:#000 url("space wallpaper.jpg") center center fixed;
    background-size:cover;
}

header{
    background:#e60012;
    color:white;
    padding:18px 30px;
    font-size:30px;
    font-weight:bold;
    position:relative;
    z-index:20;
}

.container{
    width:90%;
    max-width:1400px;
    margin:40px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:40px;
}

.video{
    background:rgba(0,0,0,0.6);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.6);
    position:relative;
    z-index:10;
    min-height:400px;
}

.video-wrapper{
    position:relative;
    width:100%;
    height:70vh;
    min-height:400px;
}

.video-player{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    background:black;
}

.video-player.active{
    display:block;
}

.video-fallback{
    width:100%;
    height:100%;
    border:none;
    background:black;
}

.info{
    background:rgba(0,0,0,0.6);
    border-radius:18px;
    padding:30px;
    box-shadow:0 0 20px rgba(0,0,0,.6);
    position:relative;
    z-index:10;
}

.info h1{
    font-size:42px;
    margin-bottom:20px;
}

.info p{
    font-size:20px;
    margin:15px 0;
    color:#ddd;
}

.watch{
    display:block;
    margin-top:30px;
    background:#e60012;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
}

.watch:hover{
    background:#c40010;
}

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#e60012;
    font-size:20px;
    font-weight:bold;
}

.star{
    position:fixed;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle 2s infinite alternate;
    z-index:-1;
    pointer-events:none;
}

@keyframes twinkle{
    from { opacity:0.4; transform:scale(0.9); }
    to   { opacity:1;   transform:scale(1.1); }
}

#stars{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
    
    .video-wrapper{
        height:55vh;
    }
    
    .info h1{
        font-size:32px;
    }
    
    .info p{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>
🎬 Minecraft Movie
</header>

<div class="container">

<div class="video">

<div class="video-wrapper">
    <!-- DrivePlyr Player -->
    <div id="driveplyr-container" class="video-player active">
        <iframe 
            id="driveplyr"
            class="video-fallback"
            src="plyr.html?id=eyJpZCI6IjFLNzlvVmh5Y3FZdHhQbDd6dlRoVU1SdmlJWlo0YjRobiJ9"
            title="Minecraft Movie Player"
            loading="lazy"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen
            playsinline
            frameborder="0">
        </iframe>
    </div>

    <!-- Google Drive Fallback -->
    <div id="gdrive-fallback" class="video-player">
        <iframe
            class="video-fallback"
            src="https://drive.google.com/file/d/1K79oVhycqYtxPl7zvThUMRviIZZ4b4hn/preview"
            loading="lazy"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>
</div>

</div>

<div class="info">

<h1>Minecraft Movie</h1>

<p><b>Category:</b> Adventure</p>

<p><b>Status:</b> Full Movie</p>

<p>
Watch the Minecraft Movie directly on the website.
</p>

<a class="watch"
href="https://drive.google.com/file/d/1K79oVhycqYtxPl7zvThUMRviIZZ4b4hn/view"
target="_blank">
▶ Open in Google Drive
</a>

<a class="back" href="Movies.html">
⬅ Back to Movies
</a>

</div>

</div>

<script>
// Create a container for stars and prepend it so stars stay behind content
const stars=document.createElement("div");
stars.id="stars";
document.body.prepend(stars);

// Lightweight stars generator — ~60 stars for low-RAM devices and TVs
for(let i=0;i<60;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    let size=Math.random()*2+1;
    s.style.width=size+"px";
    s.style.height=size+"px";
    stars.appendChild(s);
}

// DrivePlyr Fallback Logic - Only switch if DrivePlyr actually fails
document.addEventListener('DOMContentLoaded', function() {
    const driveplyrContainer = document.getElementById('driveplyr-container');
    const gdriveContainer = document.getElementById('gdrive-fallback');
    const driveplyrFrame = document.getElementById('driveplyr');
    
    let fallbackTriggered = false;
    
    function switchToGDrive() {
        if (!fallbackTriggered) {
            fallbackTriggered = true;
            driveplyrContainer.classList.remove('active');
            gdriveContainer.classList.add('active');
        }
    }
    
    // Only trigger fallback on actual errors
    driveplyrFrame.onerror = function() {
        switchToGDrive();
    };
    
    // Listen for errors from DrivePlyr iframe via postMessage
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'driveplyr-error') {
            switchToGDrive();
        }
    });
    
    // Only fallback if iframe is blocked or cannot load at all (check after 10 seconds)
    setTimeout(function() {
        if (!fallbackTriggered) {
            try {
                // Check if iframe has any content
                const iframeDoc = driveplyrFrame.contentDocument || driveplyrFrame.contentWindow?.document;
                if (!iframeDoc) {
                    switchToGDrive();
                }
            } catch (e) {
                // Cross-origin - iframe loaded, so it's working
            }
        }
    }, 10000);
});
</script>

</body>
</html>
