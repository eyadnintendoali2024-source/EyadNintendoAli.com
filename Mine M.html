<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Movie</title>
<link rel="icon" href="favicon.ico">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    background:#000 url("space wallpaper.jpg") center center fixed;
    background-size:cover;
}

header{
    background:#e60012;
    color:white;
    padding:18px 30px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:1400px;
    margin:40px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:40px;
}

.video{
    background:rgba(0,0,0,0.6);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.6);
}

.video iframe{
    width:100%;
    height:70vh;
    min-height:400px;
    border:none;
    background:black;
}

.info{
    background:rgba(0,0,0,0.6);
    border-radius:18px;
    padding:30px;
    box-shadow:0 0 20px rgba(0,0,0,.6);
}

.info h1{
    font-size:42px;
    margin-bottom:20px;
}

.info p{
    font-size:20px;
    margin:15px 0;
    color:#ddd;
}

.watch{
    display:block;
    margin-top:30px;
    background:#e60012;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
}

.watch:hover{
    background:#c40010;
}

.back{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    color:#e60012;
    font-size:20px;
    font-weight:bold;
}

/* simple star style for the lightweight star script */
.star{
    position:fixed;
    background:rgba(255,255,255,0.9);
    border-radius:50%;
    pointer-events:none;
}
</style>
</head>

<body>

<header>
🎬 Minecraft Movie
</header>

<div class="container">

<div class="video">

<iframe
src="https://drive.google.com/file/d/1K79oVhycqYtxPl7zvThUMRviIZZ4b4hn/preview"
loading="lazy"
allow="autoplay; fullscreen"
allowfullscreen>
</iframe>

</div>

<div class="info">

<h1>Minecraft Movie</h1>

<p><b>Category:</b> Adventure</p>

<p><b>Status:</b> Full Movie</p>

<p>
Watch the Minecraft Movie directly on the website.
</p>

<a class="watch"
href="https://drive.google.com/file/d/1K79oVhycqYtxPl7zvThUMRviIZZ4b4hn/view"
target="_blank">
▶ Open in Google Drive
</a>

<a class="back" href="Movies.html">
⬅ Back to Movies
</a>

</div>

</div>

<script>
// Lightweight stars generator — ~60 stars for low-RAM devices and TVs
for(let i=0;i<60;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    let size=Math.random()*2+1;
    s.style.width=size+"px";
    s.style.height=size+"px";
    document.body.appendChild(s);
}
</script>

</body>
</html>
